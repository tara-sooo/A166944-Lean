name: Probe the Prove2Me v4.29 environment

# Why this workflow exists
#
# Prove2Me is isolated per Lean environment, and the Twin Prime Conjecture
# mission points at the *v4.29.0-rc3* instance of `twin_prime_conjecture`
# (theorem a3b92c39, mathlib rev 777aaa61), not the v4.33.1 one (185e92b6,
# 0df444a) that the A166944 work targets. Imports resolve only within one
# environment, so connecting the A166944 route to the mission means re-creating
# the A166944 chain inside v4.29.
#
# Before doing that by hand, this workflow answers the question that decides
# whether it is feasible at all: **does the A166944 development compile against
# Mathlib 777aaa61 under Lean v4.29.0-rc3?** The proofs use only `omega`,
# `decide`, `simp` and `rfl`, with no Mathlib imports on the recurrence side, so
# the answer is expected to be yes -- but it has to be checked rather than
# assumed, and the check should not run on the phone.
#
# This workflow is read-only with respect to the platform: it never posts
# anything. It only reports whether the sources build.

on:
  workflow_dispatch:
    inputs:
      mathlib_rev:
        description: "Prove2Me mathlib revision to probe"
        required: false
        default: "777aaa61dcd2a1258d2b4962dbe983ede4d23b2e"
      toolchain:
        description: "Lean toolchain for that revision"
        required: false
        default: "leanprover/lean4:v4.29.0-rc3"

permissions:
  contents: read

concurrency:
  group: a166944-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # Build an isolated checkout pinned to the target environment. The
      # repository's own lakefile stays untouched: this job writes its
      # manifest into a scratch directory so that a failed probe cannot
      # disturb the v4.33.1 configuration the main workflow uses.
      # ------------------------------------------------------------------
      - name: Pin the probe environment
        run: |
          set -euo pipefail
          mkdir -p probe
          cp -r A166944 probe/A166944
          printf '%s\n' "${{ github.event.inputs.toolchain }}" > probe/lean-toolchain
          cat > probe/lakefile.toml <<EOF
          name = "a166944probe"
          version = "0.1.0"
          defaultTargets = ["A166944"]

          [leanOptions]
          autoImplicit = false
          relaxedAutoImplicit = false

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "${{ github.event.inputs.mathlib_rev }}"

          [[lean_lib]]
          name = "A166944"
          globs = ["A166944.*"]
          EOF
          cat probe/lean-toolchain
          grep 'rev' probe/lakefile.toml

      # `lean-action` refuses to run without a manifest, so the manifest is
      # generated first with the toolchain the environment declares.
      #
      # A previous run failed with
      #   object file '.../v4.29.0-rc3/lib/lean/Init/Data/Nat/Sqrt.olean'
      #   of module Init.Data.Nat.Sqrt does not exist
      # which is the toolchain being incomplete rather than the project being
      # wrong: elan's init path had left the toolchain directory without the
      # prelude. Installing explicitly and then *checking* for the prelude
      # turns that into an early, legible failure instead of one at the first
      # project module.
      - name: Install the pinned toolchain
        working-directory: probe
        run: |
          set -euo pipefail
          TC="$(cat lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$TC"
          elan default "$TC"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # Ask elan where the toolchain actually is rather than reconstructing the
          # directory name: the naming rule differs between toolchain sources
          # (`lean4:v4.29.0-rc3` here, not `leanprover-lean4-v4.29.0-rc3`), and a
          # wrong guess makes the prelude check fail on a toolchain that is fine.
          LEANBIN="$(elan which lean)"
          echo "lean binary: $LEANBIN"
          LEANDIR="$(dirname "$(dirname "$LEANBIN")")"
          echo "lean dir: $LEANDIR"
          # Only the prelude is required of the toolchain. `Nat.sqrt` lives in
          # `Init/Data/Nat/Sqrt` under v4.33.1 but not under v4.29.0-rc3, where
          # Mathlib supplies it -- so checking for it here would fail on a
          # perfectly good toolchain. What the check is for is distinguishing an
          # incomplete toolchain (the original failure) from a project problem.
          for f in Init/Prelude.olean; do
            if [ ! -f "$LEANDIR/lib/lean/$f" ]; then
              echo "::error::toolchain is missing $f -- the prelude did not install"
              ls "$LEANDIR/lib/lean/Init" 2>/dev/null | head -20 || true
              exit 1
            fi
          done
          echo "prelude present"
          # Where sqrt lives, for the record, without failing on it.
          if [ -f "$LEANDIR/lib/lean/Init/Data/Nat/Sqrt.olean" ]; then
            echo "sqrt in toolchain: yes"
          else
            echo "sqrt in toolchain: no -- expected under v4.29, supplied by Mathlib"
          fi

      - name: Fetch Mathlib at the pinned revision
        working-directory: probe
        run: lake update

      - name: Fetch the precompiled cache for that revision
        working-directory: probe
        run: lake exe cache get

      # ------------------------------------------------------------------
      # The probe proper. `MathlibFree` is the recurrence-side subset: the
      # modules whose transitive imports never touch Mathlib, so they must
      # build in any environment. `MathlibDependent` is the part that needs
      # `Nat.Prime` and therefore depends on the revision's Mathlib API.
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # Diagnose where `Nat.sqrt` lives in this environment. Under v4.33.1 it
      # is in the toolchain (`Init/Data/Nat/Sqrt`), which is why the project
      # imports it from there to stay Mathlib-free; under v4.29.0-rc3 the
      # toolchain does not carry it, so the import path has to differ. Ask the
      # environment rather than assuming which side owns it.
      # ------------------------------------------------------------------
      - name: Locate Nat.sqrt in this environment
        working-directory: probe
        run: |
          set -euo pipefail
          LEANBIN="$(elan which lean)"
          LEANDIR="$(dirname "$(dirname "$LEANBIN")")"
          echo "--- toolchain lib/lean/Init/Data/Nat ---"
          ls "$LEANDIR/lib/lean/Init/Data/Nat" 2>/dev/null | grep -i sqrt || echo "  (no sqrt in toolchain)"
          echo "--- Mathlib ---"
          find .lake/packages/mathlib/Mathlib -maxdepth 4 -name 'Sqrt*' 2>/dev/null | head -5 || true
          echo "--- does Mathlib.Data.Nat.Sqrt exist as a module? ---"
          if [ -f .lake/packages/mathlib/Mathlib/Data/Nat/Sqrt.olean ]; then
            echo "  yes"
          else
            echo "  no"
          fi
          echo "--- probe: can we import it? ---"
          printf 'import Mathlib.Data.Nat.Sqrt\n#check Nat.sqrt\n' > /tmp/SqrtProbe.lean
          lake env lean /tmp/SqrtProbe.lean && echo "  import Mathlib.Data.Nat.Sqrt works" || echo "  import failed"

      # ------------------------------------------------------------------
      # Can the 118 KB single-file solution build in THIS environment?
      #
      # `Sol_target_of_travel.lean` imports only the two platform Definition
      # bundles -- no library at all beyond them -- and uses `omega`, `simp`
      # and `decide` (276 / 139 / 31 occurrences). The bundles are stubbed
      # here exactly as `check-solution.yml` stubs them, because the platform
      # hands a submission no library other than those two modules.
      #
      # This is the question that decides whether the A166944 route can be
      # resubmitted to the Twin Prime Conjecture mission at all: that mission
      # is pinned to v4.29.0-rc3, so a solution that only compiles under
      # v4.33.1 cannot reach it. Runs before the recurrence-side build
      # because it needs nothing from it -- only the Mathlib cache above.
      # ------------------------------------------------------------------
      - name: Check the single-file solution in this environment
        working-directory: probe
        run: |
          set -euo pipefail
          mkdir -p Definitions
          cat > Definitions/Def_a166944_record_core.lean <<'STUBEOF'
          import Mathlib.Data.Nat.Prime.Defs

          namespace A166944Research

          def a : Nat → Nat
            | 0 => 0
            | 1 => 2
            | n + 2 =>
              let prev := a (n + 1)
              let idx := n + 2
              if idx % 2 = 0 then prev + Nat.gcd idx prev
              else prev + Nat.gcd (idx - 2) prev

          def d (n : Nat) : Nat := a n - a (n - 1)
          def D (n : Nat) : Nat := a n - n

          def IsDifferenceRecord (R : Nat) : Prop :=
            ∃ n : Nat, 2 ≤ n ∧ d n = R ∧ ∀ k : Nat, 2 ≤ k → k < n → d k < R

          def IsGreaterTwinPrime (p : Nat) : Prop := p.Prime ∧ (p - 2).Prime
          def Target : Prop := ∀ R : Nat, 5 < R → IsDifferenceRecord R → IsGreaterTwinPrime R

          end A166944Research
          STUBEOF
          cat > Definitions/Def_a166944_moving_horizon.lean <<'STUBEOF'
          import Definitions.Def_a166944_record_core

          namespace A166944Research

          def IsMovingHorizonState (s C : Nat) : Prop := 2 ≤ s ∧ D s = C ∧ s < C

          def IsMovingHorizonStep (s C r C' : Nat) : Prop :=
            IsMovingHorizonState s C ∧ s < r ∧ r ≤ C ∧ 1 < d r ∧
              (∀ j : Nat, s < j → j < r → d j = 1) ∧
              D (r - 1) = C ∧ C' = D r ∧ C + 2 ≤ C' ∧ IsMovingHorizonState r C'

          def HasMovingHorizonPathTo (s C sf Cf : Nat) : Nat → Prop
            | 0 => s = sf ∧ C = Cf ∧ IsMovingHorizonState s C
            | Nat.succ q =>
                IsMovingHorizonState s C ∧
                  ∃ r C', IsMovingHorizonStep s C r C' ∧
                    HasMovingHorizonPathTo r C' sf Cf q

          def IsAttainedPreviousMaximum (P k : Nat) : Prop :=
            (∀ j : Nat, 2 ≤ j → j ≤ k → d j ≤ P) ∧
              ∃ r : Nat, 2 ≤ r ∧ r ≤ k ∧ d r = P

          end A166944Research
          STUBEOF

          # Same LEAN_PATH trick as check-solution.yml: `Definitions.X`
          # resolves to `Definitions/X.olean` under a LEAN_PATH entry, and the
          # second stub imports the first by module name.
          build() { lake env bash -c "LEAN_PATH=\"$PWD:\$LEAN_PATH\" lean -o '$1' '$2'"; }
          build Definitions/Def_a166944_record_core.olean Definitions/Def_a166944_record_core.lean
          test -f Definitions/Def_a166944_record_core.olean
          build Definitions/Def_a166944_moving_horizon.olean Definitions/Def_a166944_moving_horizon.lean
          test -f Definitions/Def_a166944_moving_horizon.olean
          echo "stub oleans built"

          cp ../prove2me/solutions/Sol_target_of_travel.lean Check.lean
          echo "=== compiling Sol_target_of_travel.lean under ${{ github.event.inputs.toolchain }} ==="
          lake env bash -c "LEAN_PATH=\"$PWD:\$LEAN_PATH\" lean Check.lean"
          echo "SOL RESULT: compiled cleanly in this environment"

      - name: Build the recurrence-side modules
        working-directory: probe
        run: |
          set -euo pipefail
          # every module that compiles under Init alone in the v4.33.1 tree
          lake build \
            A166944.ResearchDefs \
            A166944.Lemmas \
            A166944.CanonicalRecord \
            A166944.RecordIndex \
            A166944.RecordBarrier \
            A166944.CanonicalTravel \
            A166944.CanonicalGrowth \
            A166944.StoppingCriterion \
            A166944.FirstHitArithmetic \
            A166944.BCoordinates \
            A166944.DNodes \
            A166944.GapBound \
            A166944.BStepLaw \
            A166944.BIntegrate \
            A166944.TravelReduction \
            A166944.CountFromIndex \
            A166944.CountBoundLimits \
            A166944.ExitBand \
            A166944.ExitCoordinates \
            A166944.ExitThreshold \
            A166944.CrossingRoute \
            A166944.RoomLedger \
            A166944.ExcessIdentity \
            A166944.OrphanHarvest \
            A166944.TailReduction \
            A166944.Q2TailKill \
            A166944.CompositeProbe \
            A166944.CompositeThird \
            A166944.CompSweep1000 \
            A166944.CompSweepComplete \
            A166944.CompSweepRecords \
            A166944.Q1Witness \
            A166944.EventCountFails \
            A166944.TwinSweep \
            A166944.RecordCoordinates \
            A166944.BCapDictionary

      # ------------------------------------------------------------------
      # How much of any failure is `Nat.sqrt` alone?
      #
      # `CanonicalTravel.lean` is the single file in the tree that imports
      # `Init.Data.Nat.Sqrt`. Under v4.33.1 the toolchain carries that module;
      # under v4.29.0-rc3 it does not, and Mathlib owns it instead. Step
      # "Locate Nat.sqrt in this environment" reports where it lives; this
      # step measures the consequence.
      #
      # This is a measurement, not a repository change: the pristine pinned
      # copy is restored first, then patched in the scratch tree only. The
      # rewrite points the import at `Mathlib.Data.Nat.Sqrt` (confirmed to
      # exist at the pinned revision) and leaves every proof term alone --
      # `Nat.sqrt`, `Nat.sqrt_le`, `Nat.lt_succ_sqrt` and `Nat.sqrt_le_sqrt`
      # are the same names on both sides of the move.
      # ------------------------------------------------------------------
      - name: Measure how much of any failure is Nat.sqrt alone
        if: always()
        working-directory: probe
        run: |
          set -uo pipefail
          if [ ! -f lake-manifest.json ]; then
            echo "no manifest -- environment never came up, skipping the sqrt measurement"
            exit 0
          fi
          rm -rf A166944
          cp -r ../A166944 A166944
          echo "--- files importing the missing root (pristine) ---"
          grep -rln 'import Init.Data.Nat.Sqrt' A166944/ || echo "  none"
          # Repoint the root at Mathlib, in the scratch copy only.
          find A166944 -name '*.lean' -exec grep -l 'Init\.Data\.Nat\.Sqrt' {} + \
            | while read -r f; do
                sed -i 's#import Init\.Data\.Nat\.Sqrt#import Mathlib.Data.Nat.Sqrt#' "$f"
                echo "  repointed: $f"
              done
          echo "--- files still importing the missing root ---"
          grep -rln 'Init.Data.Nat.Sqrt' A166944/ || echo "  none"
          echo "--- rebuilding the modules that depend on CanonicalTravel ---"
          ok=0; bad=0; badlist=""
          for m in CanonicalTravel CountBoundLimits RoomLedger ExcessIdentity \
                   OrphanHarvest TravelTarget; do
            if lake build "A166944.$m" >"/tmp/sq_$m.log" 2>&1; then
              echo "SQRTFREE OK   : A166944.$m"; ok=$((ok+1))
            else
              echo "SQRTFREE FAIL : A166944.$m"; bad=$((bad+1)); badlist="$badlist $m"
              grep -E 'error' "/tmp/sq_$m.log" | head -8 || true
            fi
          done
          echo "SQRTFREE SUMMARY: ok=$ok fail=$bad${badlist:+ failed:$badlist}"

      - name: Build the Mathlib-dependent modules
        working-directory: probe
        run: |
          set -euo pipefail
          lake build A166944.TargetDefs A166944.TravelTarget

      - name: Report
        if: always()
        run: |
          echo "probe finished with status ${{ job.status }}"
          echo "mathlib rev : ${{ github.event.inputs.mathlib_rev }}"
          echo "toolchain   : ${{ github.event.inputs.toolchain }}"
