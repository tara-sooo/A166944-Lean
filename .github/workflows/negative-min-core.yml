name: Negative MIN narrow core check
on:
  push:
    branches: [research/min-negative-lean-live-survival]
    paths:
      - 'research/lean/NegativeMINCore.lean'
      - '.github/workflows/negative-min-core.yml'
permissions:
  contents: read
concurrency:
  group: negative-min-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            research/lean
            .github/workflows/negative-min-core.yml
            lean-toolchain
      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: ~/.elan
          key: negative-min-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Pinned Lean toolchain only (no Lake packages)
        run: |
          set -eu
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        if: steps.lean-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.elan
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
      - name: Check only the independent core
        run: |
          set -eu
          lean research/lean/NegativeMINCore.lean
