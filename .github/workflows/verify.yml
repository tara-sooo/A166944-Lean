name: A166944 canonical verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - A166944/**
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/verify.yml
  pull_request:
    paths:
      - A166944/**
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/verify.yml

permissions:
  contents: read

concurrency:
  group: a166944-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Fetch pinned dependencies
        run: lake update

      - name: Fetch Mathlib precompiled cache
        run: lake exe cache get

      # ------------------------------------------------------------------
      # Build every module in the library.
      #
      # `lake build A166944` (the whole-library target) fails at the job-
      # computation stage with 'some modules have bad imports', so the
      # modules are listed explicitly instead. The lightweight research
      # core comes first so a break in it fails fast; the rest is chunked
      # to keep individual steps short.
      # ------------------------------------------------------------------
      - name: Build research core
        run: |
          lake build A166944.ResearchDefs \
            A166944.Lemmas \
            A166944.RecordBarrier \
            A166944.CanonicalRecord \
            A166944.RecordIndex \
            A166944.StoppingCriterion \
            A166944.FirstHitArithmetic \
            A166944.BCoordinates \
            A166944.CompositeProbe \
            A166944.CompositeThird \
            A166944.CompSweep1000 \
            A166944.CompSweepComplete \
            A166944.CompSweepRecords \
            A166944.Q2TailKill \
            A166944.DNodes \
            A166944.TwinSweep \
            A166944.TailReduction \
            A166944.BCapDictionary \
            A166944.FirstHitDivisor \
            A166944.RecordCoordinates \
            A166944.CountBoundLimits \
            A166944.CountFromIndex \
            A166944.BLedger \
            A166944.BStepLaw \
            A166944.BIntegrate \
            A166944.ExitBand \
            A166944.EventCountFails \
            A166944.ExitCoordinates \
            A166944.GapBound \
            A166944.ExitThreshold \
            A166944.CrossingRoute \
            A166944.Q1Witness \
            A166944.AbsoluteIndex \
            A166944.Q3Barrier \
            A166944.CycleLimits \
            A166944.RenormalizedGrowth \
            A166944.CompositeRecord \
            A166944.RecordIndexBounds \
            A166944.SelfHit \
            A166944.TravelReduction
      - name: Build remaining modules (1/4)
        run: |
          lake build A166944.Attempt \
            A166944.Baseline \
            A166944.Bridge \
            A166944.CanonicalGrowth \
            A166944.CanonicalTravel \
            A166944.ChargedPhaseCredits210 \
            A166944.CreditDeficitStructure210 \
            A166944.CreditDeficits210 \
            A166944.CreditHall210 \
            A166944.CreditWindows210 \
            A166944.FundedPhaseCredits210 \
            A166944.HorizonCrossing \
            A166944.QuietReturn \
            A166944.RebalancedAnchorComponents210 \
            A166944.RebalancedAnchorWindows210 \
            A166944.RebalancedBoundary210 \
            A166944.RebalancedComponentGrowth210 \
            A166944.RebalancedCreditIntervals210 \
            A166944.RebalancedCrossingGrowth210 \
            A166944.RebalancedFirstPaymentBudget210
      - name: Build remaining modules (2/4)
        run: |
          lake build A166944.RebalancedOverlapBudget210 \
            A166944.RebalancedPeriodLoad210 \
            A166944.RebalancedSmallAnchorData210 \
            A166944.RebalancedSmallAnchorDeficits210 \
            A166944.RecordReplay \
            A166944.RecurrenceDeficit210 \
            A166944.ReplayLaunch \
            A166944.ReplayOffset210 \
            A166944.ResidualAdjustedCosts210 \
            A166944.ResidualAllocation210 \
            A166944.ResidualDeficitBounds210 \
            A166944.ResidualEventTrace210 \
            A166944.ResidualFirstPayment210 \
            A166944.ResidualGrowthAllocation210 \
            A166944.ResidualGrowthWindows210 \
            A166944.ResidualIntervalBudget210 \
            A166944.ResidualIntervals210 \
            A166944.ResidualNetContributions210 \
            A166944.ResidualPhaseCredits210 \
            A166944.ResidualRebalancedCosts210
      - name: Build remaining modules (3/4)
        run: |
          lake build A166944.ResidualRebalancedMixedOffsets210 \
            A166944.ResidualRebalancedPairCaps210 \
            A166944.ResidualRebalancedPairOffsets210 \
            A166944.ResidualRebalancedTwoRequests210 \
            A166944.ResidualReuseOverlap210 \
            A166944.ResidualScaledPotential210 \
            A166944.ResidualSmallAdjusted210 \
            A166944.ResidualSmallReusePairs210 \
            A166944.ResidualStartup210 \
            A166944.ResidualStartupWeights210 \
            A166944.ResidualThreshold210 \
            A166944.ReuseCongruences \
            A166944.SeparatorBlocks210 \
            A166944.TargetDefs \
            A166944.TravelCharged210 \
            A166944.TravelClip210 \
            A166944.TravelExcess \
            A166944.TravelFactors \
            A166944.TravelFirstUse \
            A166944.TravelMod210
      - name: Build remaining modules (4/4)
        run: |
          lake build A166944.TravelMod210Data \
            A166944.TravelPhases210 \
            A166944.TravelRebalanced210 \
            A166944.TravelRebalanced210Data \
            A166944.TravelResidues \
            A166944.TravelSigned210 \
            A166944.TravelTarget \
            A166944.TwinCrossingBudget210 \
            A166944.TwinReserveTarget210 \
            A166944.TwinSignedReserveTarget210 \
            A166944.VerifiedBoundaryRecordExtension \
            A166944.VerifiedFiftyMillionBridge \
            A166944.VerifiedLaterRecordExtension \
            A166944.VerifiedRecordExtension \
            A166944.VerifiedRecordPrefix \
            A166944.VerifiedTravelExtension \
            A166944.VerifiedTwinPrimePrefix


      # ------------------------------------------------------------------
      # Single-file checks that `lake build` does not exercise the same way:
      # these are `#check` / `#print axioms` scripts, and the bridge must agree
      # with the pinned upstream Formal Conjectures source.
      # ------------------------------------------------------------------
      - name: Check canonical bridge
        run: lake env lean A166944/Bridge.lean

      - name: Check reproducible canonical baseline
        run: lake env lean A166944/Baseline.lean

      # ------------------------------------------------------------------
      # Declaration guard.
      #
      # A build succeeds whether a module has four theorems or twelve, so CI
      # cannot see a silent loss of content. This happened once: a deduplication
      # pass dropped eight declarations from TailReduction while CI stayed green.
      # `DECLARATIONS.json` is the manifest; a module that loses declarations, or
      # a new module that is not listed, fails the job.
      # ------------------------------------------------------------------
      - name: Check the declaration manifest
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          man = json.load(open("DECLARATIONS.json"))
          now, bad = {}, []
          for f in sorted(os.listdir("A166944")):
              if not f.endswith(".lean"):
                  continue
              s = open(os.path.join("A166944", f), encoding="utf-8", errors="replace").read()
              th = len(re.findall(r'^(?:private\s+|protected\s+)?theorem\s', s, re.M))
              df = len(re.findall(r'^(?:private\s+|protected\s+)?def\s', s, re.M))
              now[f[:-5]] = th + df
          for m, n in man["modules"].items():
              if now.get(m, -1) < n:
                  bad.append(f"{m}: {n} -> {now.get(m, 'MISSING')}")
          for m in now:
              if m not in man["modules"]:
                  bad.append(f"{m}: new module, not in the manifest")
          if bad:
              print("::error::declaration manifest mismatch")
              for b in bad:
                  print("   " + b)
              sys.exit(1)
          print(f"manifest ok: {len(now)} modules, {sum(now.values())} declarations")
          EOF

      # ------------------------------------------------------------------
      # Axiom audit for the headline results. `#print axioms` must stay inside
      # the standard three; a `sorryAx` line here fails the job.
      # ------------------------------------------------------------------
      - name: Audit axioms of the headline theorems
        run: |
          cat > AxiomAudit.lean <<'EOF'
          import A166944.RecordBarrier
          import A166944.CanonicalRecord
          import A166944.TravelTarget
          import A166944.StoppingCriterion
          import A166944.FirstHitArithmetic
          import A166944.AbsoluteIndex
          import A166944.CompSweepComplete
          #print axioms A166944Research.difference_records_unbounded
          #print axioms A166944Research.record_index_iff_no_canonical_escape
          #print axioms A166944Research.no_event_on_interval_iff
          #print axioms A166944Research.moving_horizon_event_divisor_gap
          #print axioms A166944Research.D_ge_sub_two
          #print axioms A166944Research.composite_differences_below_1000
          #print axioms A166944Research.no_composite_difference_above_200
          EOF
          lake env lean AxiomAudit.lean
          if lake env lean AxiomAudit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::a headline theorem depends on sorryAx"
            exit 1
          fi
          rm -f AxiomAudit.lean
